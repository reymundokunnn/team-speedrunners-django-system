{% extends 'base.html' %}
{% load static %}

{% block title %}Revision Requested - Presenta{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="card border-success shadow">
                <div class="card-body p-5">
                    <i class="fas fa-check-circle text-success mb-4" style="font-size: 4rem;"></i>
                    <h2 class="card-title text-success mb-3">Revision Request Submitted!</h2>
                    <h3>Revision submitted for: {{ revision_request.file_name }}</h3>
                                            <p>Status: Pending</p>
                                            <a href="{% url 'revision_requests_list' %}" class="btn btn-primary">View Requests</a>
                                            <a href="{% url 'user_dashboard' %}" class="btn btn-outline-secondary btn-lg">Back to Dashboard</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
