{% load static %}
    <div class="side-panel">
        <div class="side-item-wrapper">
            <div class="side-item" data-section="dashboard">
                <img src="{% static 'img/dashboard/side-0.png' %}" class="dashboard-sidebar-icon">
                <a href="{% url 'admin_dashboard' %}">Dashboard</a>
            </div>
            <div class="side-item" data-section="requests">
                <img src="{% static 'img/dashboard/side-2.png' %}" class="dashboard-sidebar-icon">
                <a href="{% url 'admin_dashboard' %}#requests">All Requests</a>
            </div>
            <div class="side-item" data-section="users">
                <img src="{% static 'img/dashboard/side-6.png' %}" class="dashboard-sidebar-icon">
                <a href="{% url 'admin_dashboard' %}#users">Users</a>
            </div>
            <div class="side-item" data-section="reports">
                <img src="{% static 'img/dashboard/side-7.png' %}" class="dashboard-sidebar-icon">
                <a href="#reports" onclick="showDashboardSection('reports'); return false;">Reports</a>
            </div>
            <div class="side-item" data-section="system-status">
                <img src="{% static 'img/dashboard/side-8.png' %}" class="dashboard-sidebar-icon">
                <a href="#" onclick="showDashboardSection('system-status'); return false;">System Status</a>
            </div>
        </div>
    </div>
